name: Update Coverage Report

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: vertex-framework-coverage
  cancel-in-progress: false

jobs:
  update-coverage:
    name: Update COVERAGE.md after merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up PHP with Xdebug
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.5"
          extensions: dom, mbstring, xml, xmlwriter
          coverage: xdebug

      - name: Install PHPUnit 13
        run: |
          mkdir -p "$RUNNER_TEMP/phpunit"
          cd "$RUNNER_TEMP/phpunit"
          composer init --no-interaction --name=vertex/framework-coverage-tools
          composer require --no-interaction --no-progress phpunit/phpunit:13.4.5
          echo "$RUNNER_TEMP/phpunit/vendor/bin" >> "$GITHUB_PATH"

      - name: Generate Clover coverage report
        run: |
          phpunit --configuration phpunit.xml --coverage-clover=coverage.xml
          test -s coverage.xml

      - name: Update COVERAGE.md
        run: php scripts/update-coverage.php

      - name: Commit coverage report
        run: |
          if git diff --quiet -- COVERAGE.md; then
            echo "COVERAGE.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COVERAGE.md
          git commit -m "docs: update test coverage report"
          git push origin HEAD:main
