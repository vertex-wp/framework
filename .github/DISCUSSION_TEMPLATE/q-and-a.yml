title: "Question: "
body:
  - type: markdown
    attributes:
      value: |
        Check the README and existing discussions before posting. Do not include credentials, personal data or production secrets.
  - type: input
    id: vertex_version
    attributes:
      label: Vertex version
      description: Which Vertex version or commit are you using?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your PHP and WordPress versions.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to achieve and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant code or context
      description: Include a minimal example, with secrets and personal data removed.
    validations:
      required: false
