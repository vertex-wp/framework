name: Bug report
description: Report a reproducible defect in Vertex.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues. For security vulnerabilities, follow SECURITY.md instead of creating a public issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the problem.
      placeholder: Describe what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, reproducible example where possible.
      placeholder: |
        1. Initialise Vertex with...
        2. Call...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: vertex-version
    attributes:
      label: Vertex version
      placeholder: e.g. 1.4.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
      placeholder: e.g. 6.7
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, personal information and production data before posting.
    validations:
      required: false
